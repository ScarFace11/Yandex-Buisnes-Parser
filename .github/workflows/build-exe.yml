name: Build Windows EXE

# Build the Windows .exe on every release tag (v*) and attach it to the
# GitHub Release. Also runnable manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the asset

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Guard — релиз нельзя собрать из dev-версии
        # Публичная сборка выпускается только версией без суффикса «-dev»:
        # иначе у пользователей включится метка DEV и отключится авто-обновление.
        env:
          YANDEX_API_KEY: ci-dummy-key
        run: |
          python - <<'PY'
          import sys
          import config
          print('APP_VERSION =', config.APP_VERSION)
          if config.is_dev_build():
              print('::error::APP_VERSION содержит суффикс -dev. В config.py укажите '
                    'версию релиза без суффикса (например "2.3.0") и повторите.')
              sys.exit(1)
          PY

      - name: Guard — тег и version.json совпадают с версией
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          YANDEX_API_KEY: ci-dummy-key
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, sys
          import config
          v = config.APP_VERSION
          tag = os.environ['TAG']
          with open('static/version.json', encoding='utf-8-sig') as fh:
              jv = json.load(fh).get('version', '')
          problems = []
          if tag != 'v' + v:
              problems.append(f'тег {tag} не совпадает с APP_VERSION v{v}')
          if jv != v:
              problems.append(f'static/version.json {jv} != APP_VERSION {v} '
                              '(иначе авто-обновление у пользователей не сработает)')
          if problems:
              print('::error::' + '; '.join(problems))
              sys.exit(1)
          print(f'OK: {tag}, APP_VERSION {v}, version.json {jv}')
          PY

      - name: Run tests
        # Playwright browsers are not installed in CI — parser tests mock
        # HTTP/CDP and don't need them; the app falls back gracefully.
        env:
          YANDEX_API_KEY: ci-dummy-key
        run: python -m pytest tests/ -q

      - name: Setup Node (UI logic tests)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run UI logic tests
        run: node --test "tests/ui/*.test.mjs"

  build:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      # fetch-depth: 0 — full history so the download_url stamp commit can push
      # back onto main (the in-app updater reads version.json from main)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe (parser.spec)
        run: pyinstaller parser.spec --noconfirm

      - name: Smoke test the build
        shell: pwsh
        run: |
          $exe = 'dist/YandexBusinessParser/YandexBusinessParser.exe'
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          # Start the server from a clean dir, wait for HTTP 200 on /
          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item -Recurse -Force dist/YandexBusinessParser "$work/app"
          $proc = Start-Process -FilePath "$work/app/YandexBusinessParser.exe" -WorkingDirectory $work -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200 -and $r.Content -match 'Поиск клиентов') { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw 'smoke test failed: no HTTP 200 from the bundled server' }
            Write-Host 'Smoke test passed: server responded with the UI page.'
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Zip the build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/YandexBusinessParser/* `
            -DestinationPath dist/YandexBusinessParser-windows-x64.zip

      # Stamp the exe asset URL into version.json so the app's built-in
      # auto-updater downloads the release zip from inside the running exe.
      - name: Stamp download_url into version.json (release assets only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $p = 'static/version.json'
          $j = Get-Content $p -Raw -Encoding UTF8 | ConvertFrom-Json
          $j | Add-Member -Force -NotePropertyName download_url `
            -NotePropertyValue 'https://github.com/${{ github.repository }}/releases/latest/download/YandexBusinessParser-windows-x64.zip'
          $j | ConvertTo-Json -Depth 5 | Set-Content $p -Encoding UTF8
          Write-Host "version.json -> $($j.version), download_url = $($j.download_url)"
          # version.json is served raw from main; keep the stamped value in
          # the repo so /check-version always returns a working URL.
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add $p
          git commit -m "chore(ci): stamp download_url for v$($j.version) [skip ci]" || Write-Host 'nothing to commit'
          git push origin HEAD:main || Write-Host 'push failed (non-fatal)'

      - name: Attach exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YandexBusinessParser-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI/CD self-update chain (release tags only):
      #   1. Release published with the exe zip (step above)
      #   2. version.json stamped with the asset URL and pushed to main
      #   → every running .exe sees «Доступна новая версия» within 30 min,
      #     clicks «Обновить сейчас» and updates WITHOUT visiting GitHub.
      - name: Verify the release is ready for the in-app updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = 'https://github.com/${{ github.repository }}/releases/download/' + $tag + '/YandexBusinessParser-windows-x64.zip'
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $expected -Method Head -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200) { Write-Host "Release asset OK: $expected"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 6
          }
          Write-Host "::warning::Release asset not reachable yet at $expected — /update/status falls back to /releases/latest/download which resolves after propagation"
          exit 0

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: YandexBusinessParser-windows-x64
          path: dist/YandexBusinessParser-windows-x64.zip
          retention-days: 14
