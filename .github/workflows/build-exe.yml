name: Build Windows EXE

# Build the Windows .exe on every release tag (v*) and attach it to the
# GitHub Release. Also runnable manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the asset

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Playwright browsers are not installed in CI — parser tests mock
        # HTTP/CDP and don't need them; the app falls back gracefully.
        env:
          YANDEX_API_KEY: ci-dummy-key
        run: python -m pytest tests/ -q

  build:
    name: Build Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe (parser.spec)
        run: pyinstaller parser.spec --noconfirm

      - name: Smoke test the build
        shell: pwsh
        run: |
          $exe = 'dist/YandexBusinessParser/YandexBusinessParser.exe'
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          # Start the server from a clean dir, wait for HTTP 200 on /
          $work = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item -Recurse -Force dist/YandexBusinessParser "$work/app"
          $proc = Start-Process -FilePath "$work/app/YandexBusinessParser.exe" -WorkingDirectory $work -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/' -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200 -and $r.Content -match 'Поиск клиентов') { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw 'smoke test failed: no HTTP 200 from the bundled server' }
            Write-Host 'Smoke test passed: server responded with the UI page.'
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Zip the build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/YandexBusinessParser/* `
            -DestinationPath dist/YandexBusinessParser-windows-x64.zip

      - name: Attach exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YandexBusinessParser-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: YandexBusinessParser-windows-x64
          path: dist/YandexBusinessParser-windows-x64.zip
          retention-days: 14
