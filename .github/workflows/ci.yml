name: CI

# Гейт для pull request и быстрая проверка main.
#
# Сборки по тегу (build-exe.yml, build-macos.yml) тестируют только свой тег,
# поэтому обычный PR не проверялся бы вовсе.
# Здесь то же тестовое покрытие прогоняется на трёх системах: сборка есть и
# для Windows, и для macOS, а тесты должны ловить платформенные различия
# (пути, порты, `sys.platform`) до тега.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest        # Apple Silicon: та же система, что у сборки arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # Playwright browsers не ставим: тесты парсера мокают HTTP/CDP, а
        # приложение штатно откатывается на Chrome CDP и httpx.
        # При падении имя теста уходит в аннотацию коммита и в сводку шага:
        # логи джоб доступны только с правами админа, а диагноз должен читаться
        # прямо со страницы проверки — без отдельного токена.
        # shell: bash на всех трёх ОС: на windows-latest по умолчанию pwsh,
        # а диагностика ниже — POSIX-скрипт.
        shell: bash
        env:
          YANDEX_API_KEY: ci-dummy-key
        run: |
          set -o pipefail
          # Покрытие считаем только на Ubuntu и тем же прогоном: вторая
          # матрица тестов ради одного числа не нужна.
          cov=""
          if [ "$RUNNER_OS" = "Linux" ]; then cov="--cov --cov-report=term"; fi
          code=0
          python -m pytest tests/ -q $cov 2>&1 | tee pytest_out.txt || code=$?
          if [ "$code" -ne 0 ]; then
            fails=$(grep -E '^(FAILED|ERROR) ' pytest_out.txt | head -40 | paste -sd ';' -)
            totals=$(grep -E '[0-9]+ (failed|passed)' pytest_out.txt | tail -2 | tr '\n' ' ')
            echo "::error title=pytest failed::$fails — $totals"
            {
              echo '### pytest failed'
              echo '```'
              grep -E '^(FAILED|ERROR) |[0-9]+ (failed|passed)' pytest_out.txt | tail -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Coverage summary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          grep -E '^TOTAL' pytest_out.txt | tee -a "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run UI logic tests
        run: node --test "tests/ui/*.test.mjs"

      - name: Check packaging specs parse
        # Опечатка в .spec всплывает только на теге — там уже поздно.
        run: |
          python -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8'), p) for p in ('parser.spec', 'parser-mac.spec')]; print('specs OK')"

  quality:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff~=0.17"

      - name: Ruff check
        # Конфигурация — pyproject.toml: синтаксис, pyflakes, дубли
        # определений и неиспользуемые переменные. Стилистические правила,
        # которые проект сознательно не соблюдает, отключены там же.
        run: ruff check .

  workflows-lint:
    name: Workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every workflow file
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys
          import yaml
          bad = []
          for f in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(f.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f'{f}: {exc}')
          if bad:
              print('::error::Сломанный YAML: ' + '; '.join(bad))
              sys.exit(1)
          print('Все workflow-файлы читаются')
          PY
