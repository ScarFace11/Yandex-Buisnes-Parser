name: CI

# Гейт для pull request и быстрая проверка main.
#
# Сборки по тегу (build-exe.yml, build-macos.yml) тестируют только свой тег,
# поэтому обычный PR не проверялся бы вовсе.
# Здесь то же тестовое покрытие прогоняется на трёх системах: сборка есть и
# для Windows, и для macOS, а тесты должны ловить платформенные различия
# (пути, порты, `sys.platform`) до тега.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    # write — только для диагностического отчёта при падении (шаг в конце).
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest        # Apple Silicon: та же система, что у сборки arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Playwright browsers не ставим: тесты парсера мокают HTTP/CDP, а
        # приложение штатно откатывается на Chrome CDP и httpx.
        shell: bash
        env:
          YANDEX_API_KEY: ci-dummy-key
        run: |
          set -o pipefail
          python -m pytest tests/ -q 2>&1 | tee pytest.log

      - name: Publish the failure report (diagnostics)
        # ВРЕМЕННО: логи Actions атоматически недоступны без токена, поэтому при
        # падении складываем хвост pytest в ветку ci-diag-<os>, откуда его
        # видно без авторизации. Ветки удаляются вместе с этим шагом.
        if: failure()
        shell: bash
        run: |
          branch="ci-diag-${{ matrix.os }}"
          {
            echo "OS: ${{ matrix.os }}"
            echo "commit: ${{ github.sha }}"
            echo
            grep -nE "^(FAILED|ERROR)" pytest.log | head -40 || true
            echo
            echo "----- tail -----"
            tail -60 pytest.log
          } > ci-report.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -q -B "$branch"
          git add -f ci-report.txt pytest.log
          git commit -qm "ci: failure report (${{ matrix.os }}) [skip ci]" || true
          git push -qf origin "$branch"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run UI logic tests
        run: node --test "tests/ui/*.test.mjs"

      - name: Check packaging specs parse
        # Опечатка в .spec всплывает только на теге — там уже поздно.
        run: |
          python -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8'), p) for p in ('parser.spec', 'parser-mac.spec')]; print('specs OK')"

  workflows-lint:
    name: Workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every workflow file
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys
          import yaml
          bad = []
          for f in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(f.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append(f'{f}: {exc}')
          if bad:
              print('::error::Сломанный YAML: ' + '; '.join(bad))
              sys.exit(1)
          print('Все workflow-файлы читаются')
          PY
