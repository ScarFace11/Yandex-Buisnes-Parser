name: Build DEV exe

# Сборка разработчика. Запускается на каждый push в ветку dev и вручную из
# Actions. Артефакт — dev-exe (отдельное имя и папка dist-dev), GitHub Release
# НЕ создаётся и version.json НЕ правится: публичный релиз остаётся нетронутым.
#
# Когда всё готово — ветка dev вливается в main, версия выпускается без
# суффикса «-dev» и тег v* запускает публичную сборку (build-exe.yml).
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          YANDEX_API_KEY: ci-dummy-key
        run: python -m pytest tests/ -q

      - name: Setup Node (UI logic tests)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run UI logic tests
        run: node --test "tests/ui/*.test.mjs"

  build-dev:
    name: Build DEV .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check the dev version
        shell: pwsh
        run: |
          python -c "import config,sys; print('APP_VERSION =', config.APP_VERSION); sys.exit(0 if config.is_dev_build() else 1)" `
            || Write-Host "::warning::APP_VERSION без суффикса -dev — метка DEV и отключённое авто-обновление не включатся"

      - name: Build dev exe (parser.spec)
        shell: pwsh
        env:
          YP_DEV: '1'
        run: pyinstaller parser.spec --noconfirm --distpath dist-dev

      - name: Smoke test the dev build (port 5010)
        shell: pwsh
        run: |
          $exe = 'dist-dev/YandexBusinessParserDev/YandexBusinessParserDev.exe'
          if (-not (Test-Path $exe)) { throw "exe not found: $exe" }
          $work = Join-Path $env:RUNNER_TEMP 'smoke-dev'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item -Recurse -Force dist-dev/YandexBusinessParserDev "$work/app"
          $proc = Start-Process -FilePath "$work/app/YandexBusinessParserDev.exe" -WorkingDirectory $work -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5010/' -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200 -and $r.Content -match 'Поиск клиентов') { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw 'smoke test failed: dev server did not answer on 5010' }
            Write-Host 'Smoke test passed: dev build answered on 5010.'
            # DEV-сборка обязана отказываться от авто-обновления
            $st = Invoke-RestMethod -Uri 'http://127.0.0.1:5010/update/status' -TimeoutSec 5
            if (-not $st.dev) { throw 'dev build did not report dev=true' }
            if ($st.newer) { throw 'dev build offered an update' }
            Write-Host 'Dev guard OK: /update/status reports dev=true, newer=false.'
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Zip the dev build
        shell: pwsh
        run: |
          Compress-Archive -Path dist-dev/YandexBusinessParserDev/* `
            -DestinationPath dist-dev/YandexBusinessParserDev-windows-x64.zip

      - name: Upload the dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: YandexBusinessParserDev-windows-x64
          path: dist-dev/YandexBusinessParserDev-windows-x64.zip
          retention-days: 30
