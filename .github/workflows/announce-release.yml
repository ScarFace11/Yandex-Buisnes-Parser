name: Announce release (version.json)

# Единственное место, где main узнаёт о новой версии.
#
# Событие `release: published` срабатывает в момент публикации черновика, то
# есть когда архивы уже скачиваются. Так установленные приложения видят версию
# ровно тогда, когда её можно поставить: раньше version.json штамповался на
# этапе сборки (пока релиз был черновиком), а `releases/latest/download/...`
# в это время отдаёт ПРЕДЫДУЩИЙ релиз — обновлятор скачивал ту же версию,
# «консоль закрывалась», а версия оставалась прежней.
#
# Расписание раз в час — страховка: на практике событие публикации может не
# дойти до workflow (в истории проекта так и случилось), а объявить версию всё
# равно нужно. Прогон идемпотентный: если версия уже объявлена, он ничего не
# делает.
on:
  release:
    types: [published]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег опубликованного релиза: v2.3.4 (можно и без «v»)'
        required: true

permissions:
  contents: write

concurrency:
  group: announce-release
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve the tag to announce
        # Событие публикации → его тег; ручной запуск → входной параметр;
        # расписание → последний опубликованный релиз.
        #
        # Тег приводим к виду «vX.Y.Z». Без этого ручной запуск с «2.3.4»
        # (человек пишет без «v») отдавал в gh несуществующий тег: шаг ожидания
        # молча не находил релиз и падал с «релиз не опубликован» — хотя он
        # опубликован и с архивом (так и случилось на 2.3.4).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          else TAG=$(gh release view --json tagName --jq .tagName); fi
          TAG="$(printf '%s' "$TAG" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){2,}$'; then
            echo "::error::не понял тег '$TAG' — нужен вид v2.3.4 (можно и без «v»)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Объявляем версию $TAG"

      - name: Skip when the version is already announced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          have=$(python -c "import json;print(json.load(open('static/version.json',encoding='utf-8-sig')).get('version',''))")
          echo "ANNOUNCED=$have" >> "$GITHUB_ENV"
          echo "в version.json сейчас: $have, в релизе: ${TAG#v}"

      - name: Wait for the published release with the Windows asset
        if: env.ANNOUNCED != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$ANNOUNCED" = "${TAG#v}" ]; then
            echo "Версия ${TAG#v} уже объявлена — выходим."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          reason=""
          for i in $(seq 1 15); do
            if ! state=$(gh release view "$TAG" --json isDraft,assets 2>/tmp/gh.err); then
              # Релиз не читается: ещё не создан, удалён или (что и случилось
              # на 2.3.4) передан несуществующий тег. Говорим причину как есть.
              reason="$(head -1 /tmp/gh.err | tr -d '\r')"
              echo "Релиз $TAG пока не читается: ${reason:-неизвестная ошибка gh}"
              sleep 10
              continue
            fi
            # .get(): ответ gh без нужных полей не должен валить шаг трейсбеком
            # с пустой причиной — такой ответ всё равно не «готово».
            verdict=$(printf '%s' "$state" | python -c "import json,sys; d=json.load(sys.stdin); names=[a.get('name','') for a in (d.get('assets') or [])]; print('draft' if d.get('isDraft') else ('ok' if any(n.endswith('YandexBusinessParser-windows-x64.zip') for n in names) else 'no-asset:' + (','.join(names) or 'файлов нет')))" 2>/dev/null || echo 'ответ gh без ожидаемых полей')
            if [ "$verdict" = "ok" ]; then
              echo "Релиз $TAG опубликован и содержит windows-архив"
              exit 0
            fi
            reason="$verdict"
            echo "Ждём: $TAG — $verdict"
            sleep 10
          done
          echo "::error::$TAG не объявлен (${reason:-нет данных}): нужен ОПУБЛИКОВАННЫЙ релиз с файлом YandexBusinessParser-windows-x64.zip — version.json не тронут"
          exit 1

      - name: Stamp version.json and push it to main
        if: env.SKIP != '1'
        run: |
          python scripts/stamp_version.py --tag "$TAG" --changelog CHANGELOG.md \
            --repo "${{ github.repository }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add static/version.json
          git commit -m "chore(release): advertise v${TAG#v} in version.json [skip ci]" \
            || echo "версия уже объявлена — коммитить нечего"
          git push origin HEAD:main
